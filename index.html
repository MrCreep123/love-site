<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            position: relative;
        }

        .hearts-background {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .floating-heart {
            position: absolute;
            font-size: 20px;
            animation: float-up 6s ease-in infinite;
            opacity: 0;
        }

        @keyframes float-up {
            0% {
                opacity: 0;
                transform: translateY(0) rotate(0deg);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) rotate(360deg);
            }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
            z-index: 1;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            font-size: 2.5em;
            color: #667eea;
            margin-bottom: 30px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .question {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 40px;
            font-weight: 500;
        }

        .buttons-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 150px;
            padding: 20px;
        }

        button {
            font-size: 1.2em;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-yes {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            position: relative;
            z-index: 10;
        }

        .btn-yes:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.4);
        }

        .btn-yes:active {
            transform: scale(1.05);
        }

        .btn-no {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #333;
            position: absolute;
            transition: all 0.3s ease;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 80px;
        }

        .btn-no:hover {
            transform: scale(1.05);
        }

        .celebration {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        .celebration.active {
            display: flex;
        }

        .celebration-content {
            text-align: center;
            color: white;
            animation: celebrationAppear 0.5s ease-out;
        }

        @keyframes celebrationAppear {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .celebration-content h2 {
            font-size: 4em;
            margin-bottom: 20px;
            animation: heartBeat 1.5s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% {
                transform: scale(1);
            }
            10%, 30% {
                transform: scale(1.2);
            }
            20%, 40% {
                transform: scale(1.1);
            }
        }

        .celebration-content p {
            font-size: 2em;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: explode 1s ease-out forwards;
        }

        @keyframes explode {
            0% {
                opacity: 1;
                transform: translate(0, 0);
            }
            100% {
                opacity: 0;
                transform: translate(var(--x), var(--y));
            }
        }

        .big-heart {
            font-size: 10em;
            animation: heartScale 2s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes heartScale {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 2em;
            }

            .question {
                font-size: 1.2em;
            }

            button {
                font-size: 1em;
                padding: 12px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="hearts-background" id="heartsBackground"></div>

    <div class="container">
        <h1>💕 Вопрос для тебя 💕</h1>
        <p class="question">Ты меня любишь?</p>
        <div class="buttons-container">
            <button class="btn-yes" onclick="handleYes()">Да! ❤️</button>
            <button class="btn-no" id="btnNo">Нет</button>
        </div>
    </div>

    <div class="celebration" id="celebration">
        <div class="celebration-content">
            <div class="big-heart">❤️</div>
            <h2>Я тоже тебя люблю!</h2>
            <p>Ты самая лучшая! 💖</p>
        </div>
    </div>

    <script>
        // Floating hearts in background
        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = '❤️';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDelay = Math.random() * 3 + 's';
            document.getElementById('heartsBackground').appendChild(heart);

            setTimeout(() => heart.remove(), 6000);
        }

        setInterval(createFloatingHeart, 300);

        // Button "No" behavior
        const btnNo = document.getElementById('btnNo');
        let noButtonClickCount = 0;
        const phrases = [
            "Нет",
            "Уверена? 🥺",
            "Точно? 😢",
            "Может да? 🥹",
            "Ну пожалуйста! 💔"
        ];

        function moveButton() {
            const container = btnNo.parentElement;
            const containerRect = container.getBoundingClientRect();
            const btnRect = btnNo.getBoundingClientRect();

            const maxX = containerRect.width - btnRect.width;
            const maxY = containerRect.height - btnRect.height;

            let newX, newY;
            do {
                newX = Math.random() * maxX;
                newY = Math.random() * maxY;
            } while (
                Math.abs(newX - (btnRect.left - containerRect.left)) < 100 &&
                Math.abs(newY - (btnRect.top - containerRect.top)) < 100
            );

            btnNo.style.left = newX + 'px';
            btnNo.style.top = newY + 'px';

            if (noButtonClickCount < phrases.length - 1) {
                noButtonClickCount++;
                btnNo.textContent = phrases[noButtonClickCount];
            }
        }

        btnNo.addEventListener('mouseenter', moveButton);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveButton();
        });

        btnNo.addEventListener('click', (e) => {
            e.preventDefault();
            moveButton();
        });

        // Button "Yes" behavior
        function handleYes() {
            const celebration = document.getElementById('celebration');
            celebration.classList.add('active');

            // Create fireworks
            createFireworks();

            // Confetti effect
            createConfetti();

            // Play animation sound (visual only)
            setTimeout(() => {
                createMoreHearts();
            }, 500);
        }

        function createFireworks() {
            const colors = ['#ff0080', '#ff8c00', '#ffd700', '#00ff00', '#00ffff', '#ff00ff'];

            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const x = Math.random() * window.innerWidth;
                    const y = Math.random() * window.innerHeight * 0.5;

                    for (let j = 0; j < 30; j++) {
                        const firework = document.createElement('div');
                        firework.className = 'firework';
                        firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                        firework.style.left = x + 'px';
                        firework.style.top = y + 'px';

                        const angle = (Math.PI * 2 * j) / 30;
                        const velocity = 100 + Math.random() * 100;
                        const xVel = Math.cos(angle) * velocity;
                        const yVel = Math.sin(angle) * velocity;

                        firework.style.setProperty('--x', xVel + 'px');
                        firework.style.setProperty('--y', yVel + 'px');

                        document.body.appendChild(firework);

                        setTimeout(() => firework.remove(), 1000);
                    }
                }, i * 300);
            }
        }

        function createConfetti() {
            const confettiColors = ['#ff0080', '#ff8c00', '#ffd700', '#00ff00', '#00ffff', '#ff00ff', '#ff1493'];

            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.style.position = 'fixed';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-10px';
                    confetti.style.width = '10px';
                    confetti.style.height = '10px';
                    confetti.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                    confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                    confetti.style.zIndex = '9999';
                    confetti.style.animation = `fall ${2 + Math.random() * 2}s linear forwards`;

                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 4000);
                }, i * 30);
            }
        }

        function createMoreHearts() {
            const hearts = ['❤️', '💕', '💖', '💗', '💓', '💝'];

            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.position = 'fixed';
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.top = '110%';
                    heart.style.fontSize = (20 + Math.random() * 30) + 'px';
                    heart.style.zIndex = '9999';
                    heart.style.animation = `riseUp ${2 + Math.random()}s ease-out forwards`;
                    heart.style.pointerEvents = 'none';

                    document.body.appendChild(heart);

                    setTimeout(() => heart.remove(), 3000);
                }, i * 50);
            }
        }

        // Additional animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fall {
                to {
                    transform: translateY(100vh) rotate(720deg);
                    opacity: 0;
                }
            }

            @keyframes riseUp {
                to {
                    transform: translateY(-110vh);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
